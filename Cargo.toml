[package]
name = "clipscrub"
version = "1.2.0"
edition = "2026"
authors = ["rs-jensen"]
description = "Clipboard sanitizer and URL cleaner"

[dependencies]
arboard = "3.3"
crossterm = "0.27"
ratatui = "0.26"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
url = "2.5"
regex = "1.10"
directories = "5.0"
once_cell = "1.19"
thiserror = "1.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
